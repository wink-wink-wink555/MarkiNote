global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: markinote

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: markinote-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
        labels:
          component: api

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
        labels:
          component: telemetry

  - job_name: otel-exported-metrics
    static_configs:
      - targets: [otel-collector:8889]
        labels:
        component: application
