worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    log_format json_combined escape=json
        '{"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time"}';

    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;
    server_tokens off;

    # The API also protects direct/internal responses. At the browser boundary
    # emit one canonical gateway policy instead of duplicate header fields.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json
               image/svg+xml text/css text/plain;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Per-source safeguards. Deployments behind a load balancer must either
    # enforce equivalent limits there or configure trusted real-IP handling;
    # never trust arbitrary client-supplied X-Forwarded-For values.
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=agent_per_ip:10m rate=12r/m;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=streams_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Preserve a valid explicit port for same-origin checks while never
    # forwarding arbitrary raw Host syntax. The API's TrustedHost middleware
    # remains the authoritative allowlist.
    map $http_host $markinote_upstream_host {
        default $host;
        "~^[A-Za-z0-9.-]+(?::[0-9]{1,5})?$" $http_host;
    }

    # Reject exact credential-like query keys at the first HTTP hop. Access
    # logs use $uri (not $request_uri), so even this rejected request cannot
    # persist the value. The request never reaches FastAPI instrumentation.
    map $args $markinote_query_credential {
        default 0;
        "~*(?:^|&)(?:access_token|api_key|token)(?:=|&|$)" 1;
    }

    upstream markinote_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        # This gateway image is environment-neutral, so the edge virtual host
        # is a catch-all. A TLS ingress restricts the public hostname and the
        # API independently enforces MARKINOTE_TRUSTED_HOSTS.
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; form-action 'self'" always;

        if ($markinote_query_credential) {
            return 400;
        }

        location = /gateway-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}\n';
        }

        # Versioned streaming endpoints must never be buffered.
        location ~ ^/api/v1/(?:agent/chat|(?:agent|conversations)/[^/]+/(?:stream|events))$ {
            limit_req zone=agent_per_ip burst=3 nodelay;
            limit_conn streams_per_ip 4;
            proxy_pass http://markinote_api;
            proxy_http_version 1.1;
            proxy_set_header Host $markinote_upstream_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            # Preserve the upstream's explicit `no-cache, no-transform` SSE
            # policy. `expires -1` rewrites Cache-Control and would silently
            # discard `no-transform` even though buffering is disabled.
        }

        location /api/ {
            limit_req zone=api_per_ip burst=30 nodelay;
            proxy_pass http://markinote_api;
            proxy_http_version 1.1;
            proxy_set_header Host $markinote_upstream_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }

        location = /auth/access-token {
            limit_req zone=auth_per_ip burst=2 nodelay;
            proxy_pass http://markinote_api;
            proxy_http_version 1.1;
            proxy_set_header Host $markinote_upstream_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        location /auth/ {
            return 404;
        }

        location /health/ {
            proxy_pass http://markinote_api;
            proxy_http_version 1.1;
            proxy_set_header Host $markinote_upstream_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_buffering off;
            access_log off;
        }

        location = /index.html {
            expires -1;
            try_files $uri =404;
        }

        location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:css|js|map|png|jpg|jpeg|gif|svg|webp|woff2?|ttf)$" {
            expires 1y;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
